<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stumble Lucky - Painel ADM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lilita+One&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Lilita One', cursive; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        #login-screen { background: rgba(0, 0, 0, 0.6); border: 4px solid #ffd700; border-radius: 20px; padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
        h1 { font-size: 40px; color: #ffd700; text-shadow: 3px 3px 0 #000; margin-bottom: 10px; transform: rotate(-2deg); }
        .subtitle { color: #4dff9e; font-size: 16px; margin-bottom: 30px; text-shadow: 1px 1px 0 #000; }
        input[type="password"] { width: 100%; padding: 15px; border-radius: 10px; border: 3px solid #4dff9e; background: rgba(255,255,255,0.1); color: #fff; font-size: 20px; text-align: center; margin-bottom: 20px; outline: none; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; background: linear-gradient(180deg, #4dff9e, #12c93d); color: #000; font-size: 22px; cursor: pointer; box-shadow: 0 5px 0 #0a7a25; transition: 0.1s; }
        button:active { transform: translateY(5px); box-shadow: none; }

        #admin-panel { display: none; width: 100%; max-width: 600px; background: rgba(0, 0, 0, 0.7); border: 4px solid #ffd700; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #admin-panel h2 { color: #ffd700; text-align: center; margin-bottom: 20px; font-size: 30px; text-shadow: 2px 2px 0 #000; }
        .channel-select { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .channel-btn { background: #16213e; border: 2px solid #4dff9e; color: #4dff9e; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 14px; text-align: center; }
        .channel-btn.active { background: #4dff9e; color: #000; box-shadow: 0 0 10px #4dff9e; }
        textarea { width: 100%; height: 120px; padding: 15px; border-radius: 10px; border: 2px solid #fff; background: rgba(255,255,255,0.1); color: #fff; font-size: 16px; resize: none; margin-bottom: 15px; outline: none; }
        .mode-select { display: flex; gap: 15px; margin-bottom: 15px; justify-content: center; }
        .mode-btn { flex: 1; padding: 10px; border: 2px solid #fff; background: transparent; color: #fff; border-radius: 8px; cursor: pointer; }
        .mode-btn.active { background: #ffd700; color: #000; border-color: #ffd700; font-weight: bold; }
        .image-upload { margin-bottom: 15px; }
        .image-upload input[type="file"] { color: #fff; margin-bottom: 5px; }
        .image-upload input[type="range"] { width: 100%; margin-bottom: 5px; }
        .image-upload label { font-size: 14px; color: #ffd700; }
        #feedback { text-align: center; font-size: 16px; margin-top: 10px; min-height: 20px; color: #4dff9e; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>PAINEL ADM</h1>
        <div class="subtitle">STUMBLE LUCKY</div>
        <input type="password" id="passwordInput" placeholder="Digite a senha...">
        <button onclick="login()">ENTRAR</button>
    </div>

    <div id="admin-panel">
        <h2>ENVIAR MENSAGEM</h2>
        <div class="channel-select">
            <div class="channel-btn active" onclick="selectChannel('chat', this)"># Chat Br</div>
            <div class="channel-btn" onclick="selectChannel('news', this)"># News</div>
            <div class="channel-btn" onclick="selectChannel('download', this)"># Download</div>
            <div class="channel-btn" onclick="selectChannel('subnews', this)"># Sub News</div>
        </div>
        <div class="mode-select">
            <button class="mode-btn active" id="mode-embed" onclick="setMode('embed')">Anúncio ADM (Embed)</button>
            <button class="mode-btn" id="mode-pure" onclick="setMode('pure')">Mensagem Pura</button>
        </div>
        <textarea id="messageInput" placeholder="Digite sua mensagem aqui..."></textarea>
        <div class="image-upload">
            <label>Escolha uma imagem (opcional):</label><br>
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage()">
            <div style="margin-top: 10px;">
                <label>Tamanho da Imagem: <span id="sizeLabel">200px</span></label>
                <input type="range" id="imageSize" min="50" max="500" value="200" oninput="updateSizeLabel()">
            </div>
        </div>
        <button onclick="sendMessage()" style="background: linear-gradient(180deg, #ffd700, #ffa500); box-shadow: 0 5px 0 #b8860b; color: #000;">ENVIAR PARA O DISCORD</button>
        <div id="feedback"></div>
    </div>

    <script>
        const WEBHOOKS = {
            chat: 'https://discord.com/api/webhooks/1572286114318786790/7s-8A73wqQVQQT8tSahJ2cAmoTgywCwEQml1ZStmuxHA_7FxNrwjuWMus9UpjmGx71It',
            news: 'https://discord.com/api/webhooks/1572286550648037386/CKNQC_m6XgS13OJmv1sGPMOLiNTV4RhdW0aVeEG-psAzR-DbwjxCsD9Q0B-WoBboyvdy',
            download: 'https://discord.com/api/webhooks/1572277126114181301/B5t7BN5QiPiEJ5SDTy9SbH04jHBr669KuWwj4581uVR4WWpECi_EaDnE6N3oP4K7pngl',
            subnews: 'https://discord.com/api/webhooks/1572287662063358103/NJBHV9b6WNhWSiSrWkMVJL4v_wGqq8LMBWwjFoUcrl3TUozijF099igUNwfY4n0cOfDk'
        };

        let selectedChannel = 'chat';
        let sendMode = 'embed';
        let imageFile = null;

        function login() {
            const pass = document.getElementById('passwordInput').value;
            if (pass === 'luckysecret77') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
            } else {
                alert('Senha incorreta!');
            }
        }

        function selectChannel(channel, btn) {
            selectedChannel = channel;
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function setMode(mode) {
            sendMode = mode;
            document.getElementById('mode-embed').classList.toggle('active', mode === 'embed');
            document.getElementById('mode-pure').classList.toggle('active', mode === 'pure');
        }

        function previewImage() {
            const file = document.getElementById('imageInput').files[0];
            imageFile = file || null;
        }

        function updateSizeLabel() {
            document.getElementById('sizeLabel').innerText = document.getElementById('imageSize').value + 'px';
        }

        async function sendMessage() {
            const text = document.getElementById('messageInput').value;
            const feedback = document.getElementById('feedback');
            const url = WEBHOOKS[selectedChannel];

            if (!text && !imageFile) {
                feedback.innerText = "Digite uma mensagem ou anexe uma imagem!";
                feedback.style.color = "#ff4444";
                return;
            }

            feedback.innerText = "Enviando...";
            feedback.style.color = "#ffd700";

            const formData = new FormData();
            let payload = {};

            if (sendMode === 'embed') {
                // MODO ANÚNCIO (Embed)
                const embed = {
                    title: "📢 Anúncio do Painel Stumble Lucky",
                    description: text || " ",
                    color: 0xffd700,
                    footer: { text: "Stumble Lucky Admin" },
                    timestamp: new Date().toISOString()
                };
                
                // AQUI: Removemos o username e avatar_url para usar os da webhook
                payload = { embeds: [embed] };
            } else {
                // MODO PURO (Texto Normal)
                // AQUI: Removemos o username e avatar_url para usar os da webhook
                payload = { content: text };
            }

            formData.append('payload_json', JSON.stringify(payload));

            if (imageFile) {
                formData.append('file', imageFile);
                if (sendMode === 'embed') {
                    payload.embeds[0].image = { url: "attachment://" + imageFile.name };
                    formData.set('payload_json', JSON.stringify(payload));
                }
            }

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    feedback.innerText = "✅ Mensagem enviada com sucesso!";
                    feedback.style.color = "#4dff9e";
                    document.getElementById('messageInput').value = '';
                    document.getElementById('imageInput').value = '';
                    imageFile = null;
                } else {
                    feedback.innerText = "❌ Erro ao enviar. Verifique a webhook.";
                    feedback.style.color = "#ff4444";
                }
            } catch (error) {
                feedback.innerText = "❌ Erro de conexão.";
                feedback.style.color = "#ff4444";
            }
        }
    </script>
</body>
</html>
