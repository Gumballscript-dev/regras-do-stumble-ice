<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Metro Dash</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#1b1530;font-family:'Lilita One',Impact,'Arial Black',sans-serif;color:#fff;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;background:radial-gradient(ellipse at center,#0000 30%,#000a);padding:12px;z-index:10}
.hide{display:none!important}
.logo{font-size:clamp(56px,13vw,124px);line-height:.85;transform:rotate(-4deg);letter-spacing:2px;color:transparent;background:linear-gradient(180deg,#fff27a,#ff9d1c 55%,#ff3d6e);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:2px #3a0d5a;filter:drop-shadow(0 5px 0 #6a1b9a) drop-shadow(0 0 20px #ff6ec7aa)}
.logo span{display:block;margin-left:.7em;background:linear-gradient(180deg,#a8fff2,#19b5ff 60%,#3a5bff);-webkit-background-clip:text;background-clip:text}
.tag{font-size:clamp(14px,3.2vw,20px);color:#ffe9a6;text-shadow:0 2px 0 #0008}
.btn{font:inherit;font-size:clamp(26px,6vw,40px);padding:12px 46px;border:0;border-radius:60px;background:linear-gradient(#6dff86,#12c93d);color:#fff;text-shadow:0 3px 0 #0a7a25;box-shadow:0 8px 0 #0a7a25,0 14px 24px #0007;cursor:pointer;animation:pulse 1.3s infinite}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 #0a7a25}
.btn.b2{background:linear-gradient(#ffd23f,#ff9d1c);text-shadow:0 3px 0 #a85c00;box-shadow:0 8px 0 #a85c00,0 14px 24px #0007;animation:none;font-size:clamp(20px,4.5vw,28px);padding:8px 30px}
@keyframes pulse{50%{transform:scale(1.06)}}

#skinsMenu { background: #1b1530f0; }
.skins-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; width: 90%; max-width: 600px; max-height: 50vh; overflow-y: auto; padding: 10px; background: #0006; border-radius: 15px; border: 2px solid #ffffff33; }
.card{background:#ffffff18;border:3px solid #fff3;border-radius:16px;padding:5px;cursor:pointer;transition:transform .15s;display:flex;flex-direction:column;align-items:center}
.card.on{border-color:#ffd23f;background:#ffd23f33;transform:scale(1.05)}
.card canvas{width:70px;height:90px;display:block}
.card div{font-size:14px;margin-top:5px;text-align:center}

.info{font-size:15px;color:#ffffffb0;line-height:1.5}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px;font-size:clamp(22px,5vw,34px);text-shadow:0 3px 0 #0007;pointer-events:none;z-index:5}
#hud small{display:block;font-size:.5em;color:#ffe9a6}
#pb{pointer-events:auto;font:inherit;background:#0006;color:#fff;border:2px solid #fff6;border-radius:12px;padding:2px 12px;font-size:22px;cursor:pointer}
.big{font-size:clamp(36px,9vw,64px);color:#ffd23f;text-shadow:0 4px 0 #8a2b00}
.stat{font-size:clamp(22px,5vw,32px)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div><span id="sc">0</span><small id="bs"></small></div>
  <div style="text-align:right">🪙 <span id="co">0</span><br><button id="pb">❚❚</button></div>
</div>

<div id="menu" class="ov">
  <div class="logo">METRO<span>DASH</span></div>
  <div class="tag">Corra pelos trilhos. Fuja do guarda. Junte moedas.</div>
  <button class="btn" id="btnSkins">SKINS</button>
  <button class="btn" id="play" style="margin-top:10px;">JOGAR</button>
  <div class="info">🪙 Total: <b id="bank">0</b> &nbsp;|&nbsp; 🏆 Recorde: <b id="best">0</b><br>← → mudar de trilho &nbsp; ↑ pular &nbsp; ↓ rolar<br>No celular: deslize a tela</div>
</div>

<div id="skinsMenu" class="ov hide">
  <div class="logo" style="font-size:40px;">ESCOLHA SUA<span>SKIN</span></div>
  <div class="skins-grid" id="skinsGrid"></div>
  <button class="btn b2" id="btnBackSkins" style="margin-top:10px;">VOLTAR</button>
</div>

<div id="over" class="ov hide">
  <div class="big">VOCÊ BATEU!</div>
  <div class="stat">Pontos: <b id="fs">0</b></div>
  <div class="stat">🪙 Moedas: <b id="fc">0</b></div>
  <div class="stat" id="nr" style="color:#6dff86"></div>
  <button class="btn" id="again">DE NOVO</button>
  <button class="btn b2" id="tomenu">MENU</button>
</div>

<div id="pause" class="ov hide" style="background:#000a">
  <div class="big">PAUSADO</div>
  <button class="btn" id="resume">CONTINUAR</button>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');
const LW=2.2,CH=3.2,BACK=6;
let W,H,F,hy,dpr,sky=[];
const ls={get(k){try{return +localStorage.getItem(k)||0}catch(e){return 0}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// Hash Segura para não gerar NaN
const hash=i=>Math.abs(Math.sin(i*12.9898)*43758.5453)%1;

const CHARS=[
 {n:'Kiko',hood:'#19b5a5',cap:'#ff5a36',pants:'#2b3a67',skin:'#f1c27d',acc:'none'},
 {n:'Luna',hood:'#a64dff',cap:'#ffd23f',pants:'#262633',skin:'#8d5524',acc:'none'},
 {n:'Zeca',hood:'#ff7a1a',cap:'#2a2a2a',pants:'#3b6ea8',skin:'#c68642',acc:'none'},
 {n:'Ninja',hood:'#2a2a2a',cap:'#111111',pants:'#000000',skin:'#f1c27d',acc:'ninja'},
 {n:'Boxeador',hood:'#ff0000',cap:'#ff0000',pants:'#ffffff',skin:'#f1c27d',acc:'boxer'},
 {n:'Príncipe',hood:'#1e90ff',cap:'#ffd700',pants:'#ffffff',skin:'#f1c27d',acc:'prince'},
 {n:'Astronauta',hood:'#ffffff',cap:'#cccccc',pants:'#888888',skin:'#f1c27d',acc:'astro'},
 {n:'Pirata',hood:'#8b0000',cap:'#111111',pants:'#4a3f66',skin:'#f1c27d',acc:'pirate'},
 {n:'Gamer',hood:'#00ff00',cap:'#000000',pants:'#333333',skin:'#f1c27d',acc:'gamer'}
];

function rs(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  F=Math.min(H*.84,W*.82);hy=H*.8-CH*F/BACK;
  sky=[];for(let i=0;i<40;i++)sky.push({x:i*(W/28)-W*.1,w:W/28+4,h:20+hash(i)*H*.12});
}
addEventListener('resize',rs);rs();

let S='menu',dist=0,speed=15,coins=0,obs=[],nextZ=60,lane=0,px=0,py=0,vy=0,roll=0,t=0,camX=0,shake=0,crashT=0,paused=false;
let sel=Math.min(ls.get('mdc'),CHARS.length-1),best=ls.get('mdb'),bank=ls.get('mdt');

function reset(){dist=0;coins=0;obs=[];nextZ=60;lane=0;px=0;py=0;vy=0;roll=0;camX=0;shake=0;}

let ac;
function snd(f,d,ty,v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),n=ac.createGain();o.type=ty||'square';o.frequency.value=f;n.gain.value=v||.04;n.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(n);n.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const sCoin=()=>{snd(988,.08);setTimeout(()=>snd(1319,.12),70)};

const HUES=[2,210,45,140,28,285];
function spawn(){
  const z=nextZ,r=Math.random(),L=[-1,0,1].sort(()=>Math.random()-.5),[a,b,c]=L;
  let len=2;
  const hue=()=>HUES[Math.random()*HUES.length|0];
  const train=(l,n,v)=>{obs.push({t:'train',l,z,len:n,h:hue(),v:v||0});len=Math.max(len,n)};
  const low=(l,zz)=>obs.push({t:'low',l,z:zz===undefined?z:zz,len:.6});
  const high=l=>obs.push({t:'high',l,z,len:.6});
  const line=(l,n,y)=>{for(let i=0;i<n;i++)obs.push({t:'coin',l,z:z+i*1.8,y:y||1,len:1});len=Math.max(len,n*1.8)};
  const arch=l=>{const n=9;for(let i=0;i<n;i++)obs.push({t:'coin',l,z:z+i*1.4,y:.8+1.5*Math.sin(Math.PI*i/(n-1)),len:1});low(l,z+5.6);len=Math.max(len,n*1.4)};
  
  if(r<.26){train(a,10+Math.random()*10,Math.random()<.4?6:0);line(c,10)}
  else if(r<.44){train(a,10+Math.random()*8);train(b,10+Math.random()*8);line(c,10)}
  else if(r<.60){low(a);if(Math.random()<.6)low(b);line(c,8)}
  else if(r<.74){high(a);if(Math.random()<.5)high(b);line(c,8)}
  else if(r<.88){arch(a);if(Math.random()<.5)low(b)}
  else{train(a,12);low(b);line(c,10)}
  
  // A FÓRMULA MÁGICA INFINITA
  nextZ += len + 18 + (speed * 2) + Math.random() * 10; 
}

const P=(X,Y,d)=>{const s=F/d;return[W/2+(X-camX)*s,hy+(CH-Y)*s];};
function poly(p,c){g.fillStyle=c;g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fill();}
function box(x0,x1,y0,y1,d0,d1,col,deco){
  if(d1<.4)return;d0=Math.max(d0,.4);
  if(CH>y1)poly([P(x0,y1,d0),P(x1,y1,d0),P(x1,y1,d1),P(x0,y1,d1)],col.t);
  if(camX<x0)poly([P(x0,y0,d0),P(x0,y0,d1),P(x0,y1,d1),P(x0,y1,d0)],col.s);
  else if(camX>x1)poly([P(x1,y0,d0),P(x1,y0,d1),P(x1,y1,d1),P(x1,y1,d0)],col.s);
  const a=P(x0,y1,d0),b=P(x1,y0,d0);
  g.fillStyle=col.f;g.fillRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);
  if(deco)deco(a[0],a[1],b[0]-a[0],b[1]-a[1]);
}
const mk=(h,s,l)=>({f:`hsl(${h},${s}%,${l}%)`,s:`hsl(${h},${s}%,${l-14}%)`,t:`hsl(${h},${s-8}%,${l+16}%)`});

function drawChar(c,cx,fy,h,ch,tt,mode,rot){
  const u=h/1.9;c.save();c.translate(cx,fy);
  if(mode=='roll'){
    c.translate(0,-.42*u);c.rotate(tt*16);
    c.fillStyle=ch.hood;c.beginPath();c.arc(0,0,.42*u,0,7);c.fill();
    c.fillStyle=ch.cap;c.beginPath();c.arc(.3*u,-.1*u,.13*u,0,7);c.fill();
    c.restore();return;
  }
  if(rot)c.rotate(rot);
  const sw=mode=='idle'?Math.sin(tt*3)*.1:Math.sin(tt*14);
  const rr=(a,b,w,hh,col,r)=>{c.fillStyle=col;c.beginPath();c.roundRect(a*u,b*u,w*u,hh*u,r*u);c.fill();};
  
  for(const i of[-1,1]){c.save();c.translate(i*.15*u,-.8*u);c.rotate(sw*i*.7);rr(-.1,0,.2,.6,ch.pants,.06);rr(-.13,.52,.27,.2,'#f4f4f4',.08);c.restore();}
  rr(-.33,-1.42,.66,.68,ch.hood,.14);
  
  if(ch.acc === 'ninja') {
    rr(-.33,-.9,.66,.1,'#cc0000',.02);
    rr(-.15,-1.55,.3,.12,ch.skin,.02);
  } else if (ch.acc === 'boxer') {
    rr(-.33,-.85,.66,.1,'#ffd700',.02); 
    rr(-.42,-1.3,.22,.22,'#ff0000',.05); 
    rr(.2,-1.3,.22,.22,'#ff0000',.05); 
  } else if (ch.acc === 'prince') {
    rr(-.33,-.9,.66,.1,'#ffd700',.02);
    rr(-.15,-1.42,.3,.5,'#ffffff',.05); 
  } else if (ch.acc === 'astro') {
    c.fillStyle='#aaaaaa'; c.beginPath(); c.arc(0,-1.62*u,.35*u,0,7); c.fill(); 
    c.fillStyle='#0000ff'; c.beginPath(); c.arc(0,-1.62*u,.25*u,0,7); c.fill(); 
    rr(-.33,-1.42,.66,.3,'#ffffff',.1); 
  } else if (ch.acc === 'pirate') {
    rr(-.33,-.9,.66,.1,'#111111',.02); 
    c.fillStyle='#111'; c.beginPath(); c.arc(0,-1.7*u,.3*u,Math.PI,0); c.fill(); 
    rr(-.3,-1.7,.6,.08,'#111111',.02);
  } else if (ch.acc === 'gamer') {
    c.fillStyle='#ff0000'; c.beginPath(); c.arc(0,-1.62*u,.3*u,Math.PI,0); c.fill(); 
    rr(-.38,-1.65,.1,.4,'#ff0000',.05); 
    rr(.28,-1.65,.1,.4,'#ff0000',.05);
  } else {
    rr(-.22,-1.32,.44,.46,'#ffffff33',.08);
  }
  
  for(const i of[-1,1]){c.save();c.translate(i*.4*u,-1.32*u);c.rotate(-sw*i*.8);rr(-.08,0,.16,.5,ch.hood,.07);c.fillStyle=ch.skin;c.beginPath();c.arc(0,.54*u,.09*u,0,7);c.fill();c.restore();}
  rr(-.09,-1.5,.18,.12,ch.skin,.03);
  c.fillStyle=ch.skin;c.beginPath();c.arc(0,-1.62*u,.27*u,0,7);c.fill();
  
  if(ch.acc !== 'astro' && ch.acc !== 'pirate' && ch.acc !== 'gamer') {
    c.fillStyle=ch.cap;c.beginPath();c.arc(0,-1.64*u,.29*u,Math.PI,0);c.fill();
    rr(-.29,-1.66,.58,.07,ch.cap,.03);
  }
  rr(-.1,-1.62,.2,.05,'#0004',.02);
  c.restore();
}

let crashed=false;
function hit(){
  for(const o of obs){
    if(o.t==='coin')continue;
    const oz=o.z-dist;
    if(Math.abs(px-o.l*LW)>.85)continue;
    if(o.t==='train'){if(oz<.3&&oz+o.len>-.3&&py<2.5)return true;}
    else if(oz<.35&&oz>-.9){
      if(o.t==='low'&&py<.8)return true;
      if(o.t==='high'&&!(roll>0&&py===0)&&py<2.0)return true;
    }
  }
  return false;
}

function update(dt){
  t+=dt;
  const play=S==='play',demo=S==='menu'||S==='skins';
  if(play||demo){
    speed=demo?14:Math.min(16+dist*.012,40);
    dist+=speed*dt;
    while(nextZ<dist+120)spawn();
    obs=obs.filter(o=>o.z+o.len>dist-14);
    for(const o of obs)if(o.v)o.z-=o.v*dt;
  }
  if(play){
    px+=(lane*LW-px)*Math.min(1,dt*14);
    vy-=40*dt;py+=vy*dt;if(py<=0){py=0;vy=0;}
    if(roll>0)roll-=dt;
    camX+=(px*.7-camX)*Math.min(1,dt*6);
    for(const o of obs)if(o.t==='coin'&&!o.got&&Math.abs(o.z-dist)<.8&&Math.abs(px-o.l*LW)<.9&&o.y>py-.4&&o.y<py+1.9){o.got=1;coins++;sCoin();}
    if(hit())crash();
    $('sc').textContent=Math.floor(dist)+coins*5;$('co').textContent=coins;
  }else if(demo){camX+=(Math.sin(t*.5)*1.2-camX)*Math.min(1,dt*2);}
  if(shake>0)shake-=dt;
}
function score(){return Math.floor(dist)+coins*5;}
function crash(){
  S='over';shake=.5;crashT=t;snd(110,.5,'sawtooth',.12);
  const sc=score();bank+=coins;ls.set('mdt',bank);
  const nr=sc>best;if(nr){best=sc;ls.set('mdb',best);}
  setTimeout(()=>{if(S!=='over')return;$('fs').textContent=sc;$('fc').textContent=coins;$('nr').textContent=nr?'🏆 NOVO RECORDE!':'';$('over').classList.remove('hide');},800);
}

function render(){
  g.save();
  if(shake>0)g.translate((Math.random()-.5)*28*shake,(Math.random()-.5)*28*shake);
  const sg=g.createLinearGradient(0,0,0,hy);sg.addColorStop(0,'#1c1b5e');sg.addColorStop(.6,'#8a3fa8');sg.addColorStop(1,'#ff9a6a');
  g.fillStyle=sg;g.fillRect(-20,-20,W+40,hy+20);
  g.fillStyle='#ffe2a0';g.beginPath();g.arc(W*.5-camX*6,hy-H*.03,Math.min(W,H)*.11,0,7);g.fill();
  g.fillStyle='#3a2a64';for(const b of sky)g.fillRect(b.x-camX*5,hy-b.h,b.w,b.h+2);
  const gg=g.createLinearGradient(0,hy,0,H);gg.addColorStop(0,'#4a3f66');gg.addColorStop(1,'#241c38');
  g.fillStyle=gg;g.fillRect(-20,hy,W+40,H-hy+20);
  
  poly([P(-3.7,0,.4),P(3.7,0,.4),P(3.7,0,150),P(-3.7,0,150)],'#5b5273');
  
  // CORREÇÃO DO CRASH: O cálculo do z0 agora usa módulo para ser infinito
  const z0=Math.floor(dist/1.6)*1.6;
  for(let i=-4;i<85;i++){const d=z0+i*1.6-dist+BACK;if(d<.4)continue;poly([P(-3.4,0,d),P(3.4,0,d),P(3.4,0,d+.35),P(-3.4,0,d+.35)],'#6e4b33');}
  for(let l=-1;l<=1;l++)for(const o of[-.6,.6]){const X=l*LW+o;poly([P(X-.07,0,.4),P(X+.07,0,.4),P(X+.07,0,150),P(X-.07,0,150)],'#b7bfd1');}
  
  const it=[];
  const k0=Math.floor((dist-20)/14);
  
  // CORREÇÃO DO CRASH: O loop do cenário agora limita os prédios visíveis
  for(let k=k0;k<k0+11;k++){
    const d0=k*14-dist+BACK;
    for(const sd of[-1,1]){
      const hh=7+hash(k*2+(sd>0?1:0))*20,hu=240+hash(k+(sd>0?9:0))*50,w=5+hash(k*3+sd)*3;
      const x0=sd>0?6:-6-w,x1=x0+w;
      it.push({d:d0,f:()=>box(x0,x1,0,hh,d0,d0+11,mk(hu,30,24),(X,Y,ww,h)=>{
        const rows=Math.floor(hh/2.5);
        for(let r=0;r<rows;r++)for(let c=0;c<4;c++){if(hash(k*50+r*4+c+sd)>.5){g.fillStyle='#ffd98a';g.fillRect(X+ww*(.1+c*.22),Y+h*(.04+r/rows*.92),ww*.14,h*.4/rows);}}
      })});
      it.push({d:d0,f:()=>box(sd>0?3.9:-4.5,sd>0?4.5:-3.9,0,.6,d0,d0+14,mk(260,10,55))});
    }
  }
  for(const o of obs){
    const d0=o.z-dist+BACK,d1=d0+o.len;
    if(d1<.4||d0>150)continue;
    const X0=o.l*LW-.9,X1=o.l*LW+.9;
    if(o.t==='train')it.push({d:d0,f:()=>box(X0,X1,.2,2.6,d0,d1,mk(o.h,65,48),(X,Y,w,h)=>{
      g.fillStyle='#10202e';g.fillRect(X+w*.12,Y+h*.12,w*.76,h*.34);
      g.fillStyle='#ffffffcc';g.fillRect(X,Y+h*.62,w,h*.06);
      g.fillStyle='#ffe9a6';for(const q of[.2,.8]){g.beginPath();g.arc(X+w*q,Y+h*.84,h*.06,0,7);g.fill();}
    })});
    else if(o.t==='low')it.push({d:d0,f:()=>box(X0,X1,0,.8,d0,d1,mk(8,75,50),(X,Y,w,h)=>{
      g.fillStyle='#fff';for(let i=0;i<5;i++)g.fillRect(X+w*(i*.2+.04),Y,w*.1,h);
    })});
    else if(o.t==='high')it.push({d:d0,f:()=>{
      const c=mk(48,90,50);
      box(X0,X0+.2,0,2,d0,d1,mk(0,0,35));box(X1-.2,X1,0,2,d0,d1,mk(0,0,35));
      box(X0,X1,1.25,1.95,d0,d1,c,(X,Y,w,h)=>{g.fillStyle='#222';for(let i=0;i<6;i++)g.fillRect(X+w*(i*.17+.03),Y,w*.08,h);});
    }});
    else if(o.t==='coin'&&!o.got)it.push({d:d0,f:()=>{
      const p=P(o.l*LW,o.y,d0),r=.34*F/d0,wv=Math.abs(Math.cos(t*5+o.z))*r+r*.15;
      g.fillStyle='#f5a300';g.beginPath();g.ellipse(p[0],p[1],wv,r,0,0,7);g.fill();
      g.fillStyle='#ffd84a';g.beginPath();g.ellipse(p[0],p[1],wv*.72,r*.78,0,0,7);g.fill();
    }});
  }
  if(S!=='menu'&&S!=='skins')it.push({d:BACK,f:playerDraw});
  it.sort((a,b)=>b.d-a.d);
  for(const i of it){g.globalAlpha=i.d>70?Math.max(0,1-(i.d-70)/60):1;i.f();}
  g.globalAlpha=1;
  g.restore();
  
  if(S==='skins')for(const [i,c] of cardCtx.entries()){c.clearRect(0,0,160,200);drawChar(c,80,185,170,CHARS[i],t,'run');}
}
function playerDraw(){
  const s=F/BACK,p=P(px,py,BACK),sh=P(px,0,BACK);
  g.fillStyle='#0006';g.beginPath();g.ellipse(sh[0],sh[1],.5*s*(1-Math.min(py,2)*.2),.14*s,0,0,7);g.fill();
  const over=S==='over';
  const rolling=roll>0&&py===0&&!over;
  drawChar(g,p[0],p[1],1.8*s,CHARS[sel],over?0:t,rolling?'roll':'run',over?Math.min((t-crashT)*6,1.5):0);
}

function act(a){
  if(S!=='play'||paused)return;
  if(a==='l'&&lane>-1){lane--;snd(300,.06,'triangle');}
  if(a==='r'&&lane<1){lane++;snd(300,.06,'triangle');}
  if(a==='u'&&py===0){vy=13;roll=0;snd(520,.12,'sine');}
  if(a==='d'){if(py>0)vy=-22;else{roll=.65;snd(200,.12,'triangle');}}
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  const m={arrowleft:'l',a:'l',arrowright:'r',d:'r',arrowup:'u',w:'u',' ':'u',arrowdown:'d',s:'d'}[k];
  if(m){act(m);e.preventDefault();}
  if(k==='p'||k==='escape')togglePause();
  if(k==='enter'&&S==='menu')start();
});
let tx,ty;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{
  if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;
  if(Math.abs(dx)>Math.abs(dy))act(dx>0?'r':'l');else act(dy<0?'u':'d');
});
function togglePause(){
  if(S!=='play')return;paused=!paused;$('pause').classList.toggle('hide',!paused);
}
function start(){
  reset();S='play';crashed=false;$('menu').classList.add('hide');$('skinsMenu').classList.add('hide');$('over').classList.add('hide');$('hud').classList.remove('hide');$('bs').textContent='Recorde '+best;snd(660,.15,'sine');
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
}
function toMenu(){
  reset();S='menu';$('over').classList.add('hide');$('hud').classList.add('hide');$('menu').classList.remove('hide');$('skinsMenu').classList.add('hide');$('bank').textContent=bank;$('best').textContent=best;
}

$('btnSkins').onclick = () => { S='skins'; $('menu').classList.add('hide'); $('skinsMenu').classList.remove('hide'); };
$('btnBackSkins').onclick = () => { S='menu'; $('skinsMenu').classList.add('hide'); $('menu').classList.remove('hide'); };

$('play').onclick=start;$('again').onclick=start;$('tomenu').onclick=toMenu;
$('pb').onclick=togglePause;$('resume').onclick=togglePause;

const cardCtx=[];
const skinsGrid = $('skinsGrid');
CHARS.forEach((ch,i)=>{
  const d=document.createElement('div');d.className='card'+(i===sel?' on':'');
  const c=document.createElement('canvas');c.width=160;c.height=200;
  const n=document.createElement('div');n.textContent=ch.n;
  d.append(c,n);skinsGrid.append(d);cardCtx.push(c.getContext('2d'));
  d.onclick=()=>{sel=i;ls.set('mdc',i);[...skinsGrid.children].forEach((x,j)=>x.classList.toggle('on',j===i));snd(700,.08,'sine');};
});

$('bank').textContent=bank;$('best').textContent=best;

let last=0;
function loop(ts){
  const dt=Math.min((ts-last)/1000||0,.05);last=ts;
  if(!paused)update(dt);
  render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
