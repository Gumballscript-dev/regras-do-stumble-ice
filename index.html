<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stumble Maker</title>
    <style>
        :root {
            --bg-color: #e0f7fa;
            --text-color: #003333;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Configurações (Engrenagem) */
        #settings-modal {
            display: none;
            position: fixed;
            top: 60px; right: 20px;
            background: #1a1a1a; color: #fff;
            padding: 20px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 100; width: 280px;
        }
        .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .settings-close { cursor: pointer; font-weight: bold; color: #ff6b6b; font-size: 20px; }
        
        .discord-box {
            background: #5865F2; border-radius: 8px; padding: 10px;
            text-align: center; margin-bottom: 15px;
        }
        .discord-box img { width: 40px; margin-bottom: 5px; }
        .btn-copy {
            background: #fff; color: #5865F2; border: none;
            padding: 5px 10px; border-radius: 5px; font-weight: bold;
            cursor: pointer; margin-top: 5px; width: 100%;
        }

        /* Barra Superior */
        .top-bar {
            width: 100%; padding: 15px 20px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center;
            background: #0f2027; color: white;
        }
        .gear-btn { font-size: 28px; cursor: pointer; background: none; border: none; color: white; }

        /* Área Principal */
        .container {
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; width: 100%; max-width: 500px; gap: 20px;
        }

        /* Canvas de Prévia */
        #canvas-container {
            position: relative; width: 100%; display: flex; justify-content: center;
        }
        canvas {
            border: 2px solid #ccc; border-radius: 8px;
            max-width: 100%; height: auto; background: #fff;
        }

        /* Painel de Controles */
        .controls {
            background: var(--card-bg); padding: 20px; border-radius: 15px;
            width: 100%; box-sizing: border-box; display: flex;
            flex-direction: column; gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-weight: bold; font-size: 14px; }
        input[type="text"] {
            padding: 10px; border-radius: 8px; border: 1px solid #ccc;
            font-size: 16px;
        }
        .download-btn {
            background: #4dff9e; color: #003333; border: none;
            padding: 15px; border-radius: 10px; font-size: 18px;
            font-weight: bold; cursor: pointer; width: 100%;
            margin-top: 10px;
        }
        .lang-switch {
            display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid #444; padding-top: 15px;
        }
        .lang-btn { flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #666; background: #333; color: white; cursor: pointer; }
        .lang-btn.active { background: #4dff9e; color: #000; border-color: #4dff9e; }

    </style>
</head>
<body>

    <!-- Barra Superior -->
    <div class="top-bar">
        <h2>Stumble Maker</h2>
        <button class="gear-btn" onclick="toggleSettings()">⚙️</button>
    </div>

    <!-- Modal de Configurações -->
    <div id="settings-modal">
        <div class="settings-header">
            <h3 id="t-settings">Configurações</h3>
            <span class="settings-close" onclick="toggleSettings()">×</span>
        </div>
        
        <div class="discord-box">
            <img src="https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png" alt="Discord">
            <div style="font-size: 12px; margin-bottom: 5px;">Stumble Ice Server</div>
            <button class="btn-copy" id="t-copy-btn" onclick="copyLink()">📋 Copiar Link</button>
        </div>

        <div class="lang-switch">
            <button class="lang-btn active" id="btn-pt" onclick="setLang('pt')">PT-BR</button>
            <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <div class="container">
        <!-- Prévia da Imagem -->
        <div id="canvas-container">
            <canvas id="previewCanvas" width="800" height="800"></canvas>
        </div>

        <!-- Controles -->
        <div class="controls">
            <div class="input-group">
                <label id="lbl-name">Texto da Imagem:</label>
                <input type="text" id="playerName" value="STUMBLE CUPS" placeholder="Digite o texto..." maxlength="15">
            </div>

            <button class="download-btn" id="t-download" onclick="downloadImage()">⬇️ Baixar Imagem</button>
        </div>
    </div>

    <script>
        const DISCORD_LINK = "https://discord.gg/Q9SnqTkRb";
        let currentLang = 'pt';

        const translations = {
            pt: {
                settings: "Configurações",
                copyBtn: "📋 Copiar Link",
                copied: "✅ Copiado!",
                lblName: "Texto da Imagem:",
                download: "⬇️ Baixar Imagem",
                placeholder: "Digite o texto..."
            },
            en: {
                settings: "Settings",
                copyBtn: "📋 Copy Link",
                copied: "✅ Copied!",
                lblName: "Image Text:",
                download: "⬇️ Download Image",
                placeholder: "Type the text..."
            }
        };

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function copyLink() {
            navigator.clipboard.writeText(DISCORD_LINK).then(() => {
                const btn = document.getElementById('t-copy-btn');
                btn.innerText = translations[currentLang].copied;
                setTimeout(() => btn.innerText = translations[currentLang].copyBtn, 2000);
            });
        }

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('btn-pt').classList.toggle('active', lang === 'pt');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            
            const t = translations[lang];
            document.getElementById('t-settings').innerText = t.settings;
            document.getElementById('t-copy-btn').innerText = t.copyBtn;
            document.getElementById('lbl-name').innerText = t.lblName;
            document.getElementById('t-download').innerText = t.download;
            document.getElementById('playerName').placeholder = t.placeholder;
            
            drawPreview(); 
        }

        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const playerNameInput = document.getElementById('playerName');

        function drawPreview() {
            // 1. Fundo em Degradê Azul (como na imagem)
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0072ff'); // Azul claro em cima
            gradient.addColorStop(1, '#00c6ff'); // Azul mais claro embaixo
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Configurar o Texto
            const text = (playerNameInput.value || "STUMBLE CUPS").toUpperCase();
            
            // Vamos dividir o texto em duas linhas se tiver espaço
            let line1 = text;
            let line2 = "";
            
            if (text.includes(" ")) {
                const parts = text.split(" ");
                line1 = parts[0];
                line2 = parts.slice(1).join(" ");
            }

            // 3. Função para desenhar o texto com o estilo 3D (Adesivo)
            const draw3DText = (txt, x, y, size, fillColor1, fillColor2) => {
                ctx.font = `900 ${size}px 'Arial Black', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Sombra Preta (Deslocada)
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillText(txt, x + 10, y + 15);
                
                // Contorno Preto Grosso
                ctx.lineWidth = 20;
                ctx.strokeStyle = '#000000';
                ctx.strokeText(txt, x, y);
                
                // Preenchimento com Degradê (Cima branco, baixo amarelo/laranja)
                const textGradient = ctx.createLinearGradient(0, y - size/2, 0, y + size/2);
                textGradient.addColorStop(0, fillColor1);
                textGradient.addColorStop(1, fillColor2);
                
                ctx.fillStyle = textGradient;
                ctx.fillText(txt, x, y);
            };

            // Desenhar a primeira parte (STUMBLE) - Branco para Cinza claro
            if (line2) {
                draw3DText(line1, canvas.width / 2, canvas.height / 2 - 100, 150, '#ffffff', '#e0e0e0');
                // Desenhar a segunda parte (CUPS) - Amarelo para Laranja
                draw3DText(line2, canvas.width / 2, canvas.height / 2 + 100, 170, '#ffff00', '#ff8c00');
            } else {
                // Se for uma palavra só, desenha no meio
                draw3DText(line1, canvas.width / 2, canvas.height / 2, 150, '#ffff00', '#ff8c00');
            }
        }

        playerNameInput.addEventListener('input', drawPreview);

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'stumble-image.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        drawPreview();
    </script>
</body>
</html>
