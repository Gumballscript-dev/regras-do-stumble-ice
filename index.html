<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stumble Ice - Em Breve</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #001133 0%, #0055ff 100%);
            font-family: 'Arial Black', Impact, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #texto-em-breve {
            position: absolute;
            top: 5%;
            width: 100%;
            text-align: center;
            font-size: 7vw;
            color: #ffffff;
            text-shadow: 2px 2px 0 #0055ff, -2px -2px 0 #0055ff, 2px -2px 0 #0055ff, -2px 2px 0 #0055ff, 0px 8px 15px rgba(0,0,0,0.8);
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="texto-em-breve">EM BREVE: STUMBLE ICE</div>
    <div id="canvas-container"></div>

    <script>
        if (typeof THREE !== 'undefined') {
            const scene = new THREE.Scene();
            
            // Câmera ajustável
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Luzes
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // --- PERSONAGEM AZUL (Mais detalhado) ---
            function criarPersonagemAzul() {
                const grupo = new THREE.Group();
                const matAzul = new THREE.MeshStandardMaterial({ color: 0x0044ff, roughness: 0.3 });
                const matBranco = new THREE.MeshStandardMaterial({ color: 0xffffff });
                const matPreto = new THREE.MeshStandardMaterial({ color: 0x111111 });
                const matPele = new THREE.MeshStandardMaterial({ color: 0xd18b56 });

                // Corpo
                const corpo = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.8, 1.4, 16), matAzul);
                corpo.position.y = 1.4;
                grupo.add(corpo);

                // Detalhe Branco no Peito
                const peito = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.1), matBranco);
                peito.position.set(0, 1.6, 0.7);
                grupo.add(peito);

                // Cabeça
                const cabeca = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.9), matPele);
                cabeca.position.y = 2.6;
                grupo.add(cabeca);

                // Olhos
                const olhoGeo = new THREE.BoxGeometry(0.1, 0.2, 0.1);
                const olhoEsq = new THREE.Mesh(olhoGeo, matPreto);
                olhoEsq.position.set(-0.25, 2.6, 0.45);
                const olhoDir = new THREE.Mesh(olhoGeo, matPreto);
                olhoDir.position.set(0.25, 2.6, 0.45);
                grupo.add(olhoEsq, olhoDir);

                // Gorro
                const gorro = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2), matAzul);
                gorro.position.y = 3.1;
                grupo.add(gorro);
                
                // Borda do gorro
                const borda = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.2, 16), matBranco);
                borda.position.y = 3.05;
                grupo.add(borda);

                // Cachecol (Novo)
                const cachecol = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.2, 8, 16), matBranco);
                cachecol.rotation.x = Math.PI / 2;
                cachecol.position.y = 2.1;
                grupo.add(cachecol);
                
                const cachecolAzul = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.18, 8, 16), matAzul);
                cachecolAzul.rotation.x = Math.PI / 2;
                cachecolAzul.position.y = 2.1;
                cachecolAzul.position.z = 0.05;
                grupo.add(cachecolAzul);

                // Braços
                const bracoGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.8, 8);
                const bracoEsq = new THREE.Mesh(bracoGeo, matAzul);
                bracoEsq.position.set(-0.9, 1.7, 0);
                bracoEsq.rotation.z = Math.PI / 4;
                const bracoDir = new THREE.Mesh(bracoGeo, matAzul);
                bracoDir.position.set(0.9, 1.7, 0);
                bracoDir.rotation.z = -Math.PI / 4;
                grupo.add(bracoEsq, bracoDir);

                // Botas
                const botaGeo = new THREE.BoxGeometry(0.5, 0.4, 0.7);
                const botaEsq = new THREE.Mesh(botaGeo, matPreto);
                botaEsq.position.set(-0.35, 0.2, 0.1);
                const botaDir = new THREE.Mesh(botaGeo, matPreto);
                botaDir.position.set(0.35, 0.2, 0.1);
                grupo.add(botaEsq, botaDir);

                return grupo;
            }

            // --- PERSONAGEM DE GELO ---
            function criarPersonagemGelo() {
                const grupo = new THREE.Group();
                const matGelo = new THREE.MeshStandardMaterial({ color: 0x55ccff, transparent: true, opacity: 0.9, roughness: 0.1, metalness: 0.3 });

                // Corpo (Mais largo, estilo armadura)
                const corpo = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.7, 1.4, 16), matGelo);
                corpo.position.y = 1.4;
                grupo.add(corpo);

                // Cabeça (Mais arredondada)
                const cabeca = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), matGelo);
                cabeca.position.y = 2.5;
                grupo.add(cabeca);

                // Olhos (Fendas)
                const olhoGeo = new THREE.BoxGeometry(0.15, 0.25, 0.1);
                const matOlho = new THREE.MeshStandardMaterial({ color: 0x001133 });
                const olhoEsq = new THREE.Mesh(olhoGeo, matOlho);
                olhoEsq.position.set(-0.2, 2.5, 0.55);
                const olhoDir = new THREE.Mesh(olhoGeo, matOlho);
                olhoDir.position.set(0.2, 2.5, 0.55);
                grupo.add(olhoEsq, olhoDir);

                // Cabelo/Cristais de Gelo
                const espinhoGeo = new THREE.ConeGeometry(0.2, 1.2, 4);
                for(let i=0; i<5; i++){
                    const espinho = new THREE.Mesh(espinhoGeo, matGelo);
                    espinho.position.set((i-2)*0.25, 3.4, 0);
                    espinho.rotation.z = (i-2) * 0.25;
                    grupo.add(espinho);
                }

                // Braços
                const bracoGeo = new THREE.CylinderGeometry(0.25, 0.2, 0.8, 8);
                const bracoEsq = new THREE.Mesh(bracoGeo, matGelo);
                bracoEsq.position.set(-1, 1.6, 0);
                bracoEsq.rotation.z = Math.PI / 4;
                const bracoDir = new THREE.Mesh(bracoGeo, matGelo);
                bracoDir.position.set(1, 1.6, 0);
                bracoDir.rotation.z = -Math.PI / 4;
                grupo.add(bracoEsq, bracoDir);

                return grupo;
            }

            // Adicionando os personagens
            const personagem1 = criarPersonagemAzul();
            personagem1.position.set(-2, -1.5, 0);
            scene.add(personagem1);

            const personagem2 = criarPersonagemGelo();
            personagem2.position.set(2, -1.5, 0);
            scene.add(personagem2);

            // --- AJUSTE DE CÂMERA PARA NÃO CORTAR NA VERTICAL ---
            function ajustarCamera() {
                const aspect = window.innerWidth / window.innerHeight;
                camera.aspect = aspect;
                
                // Se a tela for em pé (celular), afasta a câmera para caber os dois bonecos
                if (aspect < 1) {
                    camera.position.set(0, 1, 14); // Mais longe
                } else {
                    camera.position.set(0, 1, 9);  // Mais perto (deitado)
                }
                camera.lookAt(0, 0, 0);
                camera.updateProjectionMatrix();
            }

            // Chama a função uma vez ao carregar e sempre que girar a tela
            ajustarCamera();
            window.addEventListener('resize', ajustarCamera);

            // Animação
            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const time = clock.getElapsedTime();

                personagem1.position.y = -1.5 + Math.abs(Math.sin(time * 8)) * 0.5; 
                personagem1.rotation.z = Math.sin(time * 4) * 0.1; 
                personagem1.rotation.y = Math.sin(time * 2) * 0.2; 

                personagem2.position.y = -1.5 + Math.abs(Math.sin(time * 8 + 1)) * 0.5;
                personagem2.rotation.z = Math.sin(time * 4 + 1) * 0.1;
                personagem2.rotation.y = Math.sin(time * 2 + 1) * 0.2;

                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
