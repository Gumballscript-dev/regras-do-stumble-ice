<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Stumble Ice</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b1a2a; font-family: 'Arial Black', sans-serif; touch-action: none; }
        
        /* --- LOBBY --- */
        #lobby { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #0f3460 0%, #1a1a2e 100%); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        #lobby h1 { font-size: 45px; color: #4dff9e; text-shadow: 4px 4px 0 #000, 0 0 25px #4dff9e; margin: 0; letter-spacing: 2px; text-align: center; }
        #lobby .subtitle { color: #ffd700; font-size: 14px; margin-bottom: 20px; text-shadow: 1px 1px 0 #000; letter-spacing: 2px; }
        
        .section-title { font-size: 16px; color: #fff; margin-top: 10px; margin-bottom: 10px; text-transform: uppercase; text-shadow: 2px 2px 0 #000; }
        
        .skins-container { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; max-width: 300px; }
        .skin-btn { width: 45px; height: 45px; border-radius: 50%; border: 3px solid #444; cursor: pointer; transition: 0.2s; }
        .skin-btn.selected { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 15px #fff; }
        
        #playBtn { margin-top: 20px; padding: 18px 60px; font-size: 22px; font-weight: 900; background: #ffd700; border: none; border-radius: 15px; color: #000; cursor: pointer; text-transform: uppercase; box-shadow: 0 6px 0 #b38f00; transition: 0.1s; }
        #playBtn:active { transform: translateY(6px); box-shadow: none; }
        
        /* --- HUD --- */
        #hud { position: absolute; top: 15px; left: 15px; color: white; font-size: 20px; text-shadow: 2px 2px 0 #000; display: none; z-index: 5; font-weight: bold; }
        #hud span { color: #4dff9e; }
        #hud-players { position: absolute; top: 15px; right: 15px; color: #ffd700; font-size: 20px; text-shadow: 2px 2px 0 #000; display: none; z-index: 5; font-weight: bold; }
        
        /* --- CONTROLES (JOYSTICK E PULO) --- */
        #controls { position: absolute; bottom: 0; width: 100%; height: 40%; display: none; z-index: 5; pointer-events: none; }
        
        /* Área do Joystick (Esquerda) */
        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px; pointer-events: auto; }
        #joystick-base { position: absolute; width: 100%; height: 100%; background: rgba(255,255,255,0.1); border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; box-sizing: border-box; }
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        /* Botão de Pulo (Direita) */
        #btnJump { position: absolute; bottom: 40px; right: 40px; width: 90px; height: 90px; border-radius: 50%; background: rgba(77, 255, 158, 0.4); border: 4px solid #4dff9e; color: white; font-size: 20px; font-weight: bold; display: flex; justify-content: center; align-items: center; pointer-events: auto; text-shadow: 1px 1px 0 #000; }
        #btnJump:active { background: rgba(77, 255, 158, 0.8); transform: scale(0.95); }

        /* --- GAME OVER --- */
        #gameOverScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: white; }
        #gameOverScreen h1 { color: #ff4444; font-size: 40px; text-shadow: 3px 3px 0 #000; margin-bottom: 10px; }
        #finalScore { font-size: 20px; margin-bottom: 20px; color: #ffd700; }
        
        /* Aviso de Rotação */
        #rotate-warning { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; box-sizing: border-box; }
        @media (orientation: portrait) { #rotate-warning { display: flex; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="rotate-warning">
        <h2>Gire o Celular</h2>
        <p>Stumble Ice foi feito para ser jogado na horizontal (landscape).</p>
    </div>

    <div id="lobby">
        <h1>STUMBLE ICE</h1>
        <div class="subtitle">MULTIPLAYER (BOTS)</div>
        
        <div class="section-title">Personalizar Skin</div>
        <div class="skins-container" id="skinContainer"></div>

        <button id="playBtn" onclick="startGame()">JOGAR</button>
    </div>

    <div id="hud">Distância: <span id="score">0</span>m</div>
    <div id="hud-players">Vivos: <span id="aliveCount">30</span></div>
    
    <div id="controls">
        <div id="joystick-zone">
            <div id="joystick-base"></div>
            <div id="joystick-stick"></div>
        </div>
        <div id="btnJump">PULO</div>
    </div>

    <div id="gameOverScreen">
        <h1>ELIMINADO!</h1>
        <p id="finalScore">Você chegou a 0m</p>
        <button class="map-btn" style="border: 2px solid #ffd700; color: #ffd700; font-size: 18px; padding: 15px 30px; background: transparent; border-radius: 10px;" onclick="location.reload()">TENTAR NOVAMENTE</button>
    </div>

    <script>
        // --- CONFIGURAÇÃO GLOBAL ---
        let scene, camera, renderer;
        let player;
        let isPlaying = false;
        let playerColor = 0x00a8ff;
        
        let score = 0;
        let baseSpeed = 0.5;
        let speed = baseSpeed;
        let gameTime = 0;

        // Física do Jogador
        let playerX = 0;
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = -0.03;
        const jumpStrength = 0.55;
        const laneWidth = 3.5;
        const maxLanes = 1.5; // Limite lateral (-1.5 a 1.5)

        // Joystick
        let joystickActive = false;
        let joystickInputX = 0;
        const joystickMaxDist = 50;

        // Bots
        let bots = [];
        let aliveBots = 30;
        const botColors = [0xe84118, 0x4cd137, 0xfbc531, 0x9c88ff, 0xff6b81, 0x00cec9];

        // Obstáculos
        let obstacles = [];
        let spawnTimer = 0;

        // --- INICIALIZAÇÃO ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Céu Azul
            scene.fog = new THREE.Fog(0x87CEEB, 30, 100);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 7, 12);
            camera.lookAt(0, 1, -10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Luzes
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createFloor();
            createPlayer();
            createBots();
            setupControls();
            createSkinButtons();

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function createFloor() {
            // Chão Principal
            const floorGeo = new THREE.BoxGeometry(15, 1, 200);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x666666 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.set(0, -0.5, -90);
            floor.receiveShadow = true;
            scene.add(floor);

            // Linhas brancas no chão
            for(let i=0; i<4; i++){
                const lineGeo = new THREE.PlaneGeometry(0.1, 200);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set((i-1.5)*laneWidth, 0.01, -90);
                scene.add(line);
            }
        }

        function createCharacter(color) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
            
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 0.8, 4, 16), mat);
            body.position.y = 1.0;
            body.castShadow = true;
            group.add(body);

            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), eyeMat);
            eyeL.position.set(-0.2, 1.4, 0.45);
            group.add(eyeL);
            const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), eyeMat);
            eyeR.position.set(0.2, 1.4, 0.45);
            group.add(eyeR);

            return group;
        }

        function createPlayer() {
            player = createCharacter(playerColor);
            player.position.set(0, 0, 0);
            scene.add(player);
        }

        function createBots() {
            for (let i = 0; i < 30; i++) {
                const color = botColors[Math.floor(Math.random() * botColors.length)];
                const bot = createCharacter(color);
                
                // Posição inicial aleatória (na frente do jogador)
                bot.position.set(
                    (Math.random() - 0.5) * 10, 
                    0, 
                    -10 - Math.random() * 30
                );
                
                bot.userData = {
                    isAlive: true,
                    targetX: bot.position.x,
                    speed: baseSpeed + (Math.random() * 0.2),
                    jumpTimer: 0,
                    isJumping: false,
                    jumpVel: 0
                };
                
                scene.add(bot);
                bots.push(bot);
            }
            updateAliveCount();
        }

        function createSkinButtons() {
            const container = document.getElementById('skinContainer');
            const colors = [0x00a8ff, 0xe84118, 0x4cd137, 0xfbc531, 0x9c88ff, 0xff6b81];
            
            colors.forEach((color, index) => {
                const btn = document.createElement('div');
                btn.className = 'skin-btn' + (index === 0 ? ' selected' : '');
                btn.style.backgroundColor = '#' + color.toString(16).padStart(6, '0');
                btn.onclick = () => {
                    playerColor = color;
                    document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                container.appendChild(btn);
            });
        }

        // --- CONTROLES (JOYSTICK) ---
        function setupControls() {
            const zone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            const base = document.getElementById('joystick-base');
            const btnJump = document.getElementById('btnJump');

            // Eventos do Joystick
            zone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                joystickActive = true;
                updateJoystick(e.touches[0]);
            });

            zone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (joystickActive) updateJoystick(e.touches[0]);
            });

            zone.addEventListener('touchend', (e) => {
                e.preventDefault();
                joystickActive = false;
                joystickInputX = 0;
                stick.style.transform = `translate(-50%, -50%)`;
            });

            function updateJoystick(touch) {
                const rect = base.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                let deltaX = touch.clientX - centerX;
                let deltaY = touch.clientY - centerY;
                
                // Limitar distância
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                if (distance > joystickMaxDist) {
                    deltaX = (deltaX / distance) * joystickMaxDist;
                    deltaY = (deltaY / distance) * joystickMaxDist;
                }
                
                stick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
                
                // Normalizar valor de X (-1 a 1)
                joystickInputX = deltaX / joystickMaxDist;
            }

            // Botão de Pulo
            btnJump.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (isPlaying && !isJumping) {
                    isJumping = true;
                    jumpVelocity = jumpStrength;
                }
            });
            
            // Teclado para teste PC
            window.addEventListener('keydown', (e) => {
                if(!isPlaying) return;
                if(e.key === "ArrowLeft" || e.key === "a") joystickInputX = -1;
                if(e.key === "ArrowRight" || e.key === "d") joystickInputX = 1;
                if(e.key === " " || e.key === "ArrowUp") {
                    if(!isJumping) { isJumping = true; jumpVelocity = jumpStrength; }
                }
            });
        }

        // --- INÍCIO DO JOGO ---
        function startGame() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('controls').style.display = 'block';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('hud-players').style.display = 'block';
            isPlaying = true;
            
            player.children[0].material.color.setHex(playerColor);
            
            // Reset Jogador
            player.position.set(0, 0, 0);
            playerX = 0;
            isJumping = false;
            jumpVelocity = 0;
            
            score = 0;
            speed = baseSpeed;
            gameTime = 0;
            obstacles.forEach(o => scene.remove(o));
            obstacles = [];
            spawnTimer = 0;
        }

        // --- LÓGICA DE BOTS E OBSTÁCULOS ---
        function spawnObstacle() {
            const obsGroup = new THREE.Group();
            const isHole = Math.random() > 0.5;
            const holeLane = Math.floor(Math.random() * 3) - 1;

            if (isHole) {
                // Parede com buraco (3 blocos, 1 some)
                for (let i = -1; i <= 1; i++) {
                    if (i !== holeLane) {
                        const block = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.5, 1), new THREE.MeshStandardMaterial({ color: 0xff3333 }));
                        block.position.set(i * laneWidth, 1.25, 0);
                        block.castShadow = true;
                        obsGroup.add(block);
                    }
                }
            } else {
                // Bloco baixo (pular)
                const block = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1, 1), new THREE.MeshStandardMaterial({ color: 0xff8800 }));
                block.position.set(holeLane * laneWidth, 0.5, 0);
                block.castShadow = true;
                obsGroup.add(block);
            }

            obsGroup.position.z = -120;
            obsGroup.userData = { isHole: isHole, holeLane: holeLane, lane: holeLane * laneWidth };
            scene.add(obsGroup);
            obstacles.push(obsGroup);
        }

        function updateBots() {
            bots.forEach(bot => {
                if (!bot.userData.isAlive) return;

                // Bots se movem para frente
                bot.position.z += speed * 0.9; // Bots um pouco mais lentos

                // IA Simples: Desviar de obstáculos
                let shouldJump = false;
                let targetX = bot.position.x;

                obstacles.forEach(obs => {
                    // Se o obstáculo está perto do bot
                    if (obs.position.z > bot.position.z - 20 && obs.position.z < bot.position.z + 2) {
                        if (obs.userData.isHole) {
                            // Se for parede com buraco, vai para o buraco
                            targetX = obs.userData.holeLane * laneWidth;
                        } else {
                            // Se for bloco baixo, tenta pular ou desviar
                            if (Math.abs(bot.position.x - obs.userData.lane) < 1.5) {
                                shouldJump = true;
                            }
                        }
                    }
                });

                // Movimento lateral do bot (suave)
                bot.position.x += (targetX - bot.position.x) * 0.05;
                // Limitar bordas
                bot.position.x = Math.max(-5, Math.min(5, bot.position.x));

                // Pulo do bot
                if (shouldJump && !bot.userData.isJumping && Math.random() > 0.1) { // 10% de chance de errar o pulo
                    bot.userData.isJumping = true;
                    bot.userData.jumpVel = jumpStrength;
                }

                // Física de pulo do bot
                if (bot.userData.isJumping) {
                    bot.position.y += bot.userData.jumpVel;
                    bot.userData.jumpVel += gravity;
                    if (bot.position.y <= 0) {
                        bot.position.y = 0;
                        bot.userData.isJumping = false;
                        bot.userData.jumpVel = 0;
                    }
                }

                // Colisão do bot (se bater, ele morre)
                obstacles.forEach(obs => {
                    if (Math.abs(obs.position.z - bot.position.z) < 0.5) {
                        if (obs.userData.isHole) {
                            // Se for parede, verifica se o bot está na pista do buraco
                            if (Math.abs(bot.position.x - obs.userData.lane) < 1.5 && bot.position.y < 1) {
                                bot.userData.isAlive = false;
                                bot.visible = false;
                                aliveBots--;
                                updateAliveCount();
                            }
                        } else {
                            // Se for bloco baixo e o bot não pulou
                            if (Math.abs(bot.position.x - obs.userData.lane) < 1.5 && bot.position.y < 0.8) {
                                bot.userData.isAlive = false;
                                bot.visible = false;
                                aliveBots--;
                                updateAliveCount();
                            }
                        }
                    }
                });

                // Se o bot passar do jogador, ele "some" (para não lotar a tela)
                if (bot.position.z > 15) {
                    bot.userData.isAlive = false;
                    bot.visible = false;
                }
            });
        }

        function updateAliveCount() {
            if (aliveBots < 0) aliveBots = 0;
            document.getElementById('aliveCount').innerText = aliveBots;
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('gameOverScreen').style.display = 'flex';
            document.getElementById('finalScore').innerText = "Você chegou a " + Math.floor(score) + "m";
        }

        // --- LOOP PRINCIPAL ---
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                gameTime++;
                speed = baseSpeed + (gameTime * 0.0001);
                if (speed > 1.8) speed = 1.8;

                // Movimento do Jogador (Joystick)
                if (joystickInputX !== 0) {
                    playerX += joystickInputX * 0.2; // Velocidade lateral
                    playerX = Math.max(-5, Math.min(5, playerX)); // Limite da pista
                }
                player.position.x += (playerX - player.position.x) * 0.3; // Suavização
                player.rotation.z = -joystickInputX * 0.2; // Inclinação ao andar

                // Física do Jogador
                if (isJumping) {
                    player.position.y += jumpVelocity;
                    jumpVelocity += gravity;
                    if (player.position.y <= 0) {
                        player.position.y = 0;
                        isJumping = false;
                        jumpVelocity = 0;
                    }
                }

                // Spawn de Obstáculos
                spawnTimer++;
                if (spawnTimer > (50 - (speed * 5))) {
                    spawnObstacle();
                    spawnTimer = 0;
                }

                // Atualiza Bots
                updateBots();

                // Atualiza Obstáculos
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += speed;

                    // Colisão do Jogador
                    if (Math.abs(obs.position.z - player.position.z) < 0.8) {
                        obs.children.forEach(child => {
                            if (child.geometry.parameters.height > 2) { // Parede
                                if (Math.abs(child.position.x - player.position.x) < 1.2 && player.position.y < 1) gameOver();
                            } else { // Bloco baixo
                                if (Math.abs(child.position.x - player.position.x) < 1.2 && player.position.y < 0.8) gameOver();
                            }
                        });
                    }

                    // Remove obstáculo
                    if (obs.position.z > 15) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        score += 1;
                        document.getElementById('score').innerText = Math.floor(score);
                    }
                }

                // Câmera
                camera.position.x += (player.position.x * 0.5 - camera.position.x) * 0.05;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
