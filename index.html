<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stumble Ice</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; font-family: 'Arial Black', sans-serif; }
        
        /* --- LOBBY --- */
        #lobby { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #0f3460 0%, #1a1a2e 100%); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        #lobby h1 { font-size: 50px; color: #ffd700; text-shadow: 4px 4px 0 #000, 0 0 25px #ffd700; margin: 0; letter-spacing: 2px; text-align: center; }
        #lobby .subtitle { color: #4dff9e; font-size: 16px; margin-bottom: 30px; text-shadow: 1px 1px 0 #000; }
        
        .section-title { font-size: 18px; color: #fff; margin-top: 15px; margin-bottom: 10px; text-transform: uppercase; text-shadow: 2px 2px 0 #000; }
        
        .skins-container { display: flex; gap: 15px; margin-bottom: 20px; }
        .skin-btn { width: 55px; height: 55px; border-radius: 50%; border: 4px solid #555; cursor: pointer; transition: 0.2s; position: relative; }
        .skin-btn.selected { border-color: #fff; transform: scale(1.2); box-shadow: 0 0 20px #fff; }
        .skin-btn::after { content: '👀'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; }
        
        .maps-container { display: flex; gap: 15px; margin-bottom: 30px; }
        .map-btn { background: #16213e; border: 3px solid #4dff9e; color: #4dff9e; padding: 15px 25px; border-radius: 15px; font-size: 16px; font-weight: 900; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .map-btn.selected { background: #4dff9e; color: #000; box-shadow: 0 0 20px #4dff9e; }

        #playBtn { padding: 20px 80px; font-size: 24px; font-weight: 900; background: #ffd700; border: none; border-radius: 15px; color: #000; cursor: pointer; text-transform: uppercase; box-shadow: 0 8px 0 #b38f00; transition: 0.1s; }
        #playBtn:active { transform: translateY(8px); box-shadow: none; }
        
        /* --- HUD --- */
        #hud { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; text-shadow: 3px 3px 0 #000; display: none; z-index: 5; font-weight: bold; }
        #hud span { color: #4dff9e; }
        
        #controls { position: absolute; bottom: 30px; width: 100%; display: none; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 5; }
        .dpad { display: flex; gap: 20px; }
        .control-btn { width: 80px; height: 80px; background: rgba(255,255,255,0.2); border: 4px solid rgba(255,255,255,0.5); border-radius: 25px; font-size: 35px; color: white; display: flex; justify-content: center; align-items: center; user-select: none; touch-action: manipulation; backdrop-filter: blur(5px); }
        .control-btn:active { background: rgba(255,255,255,0.6); }
        #btnJump { width: 100px; border-radius: 50%; background: rgba(77, 255, 158, 0.4); border-color: #4dff9e; }
        #btnJump:active { background: rgba(77, 255, 158, 0.8); }

        #gameOverScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: white; }
        #gameOverScreen h1 { color: #ff4444; font-size: 50px; text-shadow: 3px 3px 0 #000; margin-bottom: 10px; }
        #finalScore { font-size: 24px; margin-bottom: 30px; color: #ffd700; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- LOBBY -->
    <div id="lobby">
        <h1>STUMBLE ICE</h1>
        <div class="subtitle">Mobile Edition</div>
        
        <div class="section-title">Personalizar Skin</div>
        <div class="skins-container">
            <div class="skin-btn selected" style="background: #00a8ff;" onclick="selectSkin(0x00a8ff, this)"></div>
            <div class="skin-btn" style="background: #e84118;" onclick="selectSkin(0xe84118, this)"></div>
            <div class="skin-btn" style="background: #4cd137;" onclick="selectSkin(0x4cd137, this)"></div>
            <div class="skin-btn" style="background: #fbc531;" onclick="selectSkin(0xfbc531, this)"></div>
            <div class="skin-btn" style="background: #9c88ff;" onclick="selectSkin(0x9c88ff, this)"></div>
        </div>

        <div class="section-title">Mapa</div>
        <div class="maps-container">
            <div class="map-btn selected" id="btnMapBlock" onclick="selectMap('block', this)">Block Dash</div>
            <div class="map-btn" id="btnMapLaser" onclick="selectMap('laser', this)">Laser Tracer</div>
        </div>

        <button id="playBtn" onclick="startGame()">Jogar</button>
    </div>

    <!-- HUD -->
    <div id="hud">Distância: <span id="score">0</span>m</div>
    
    <!-- CONTROLES -->
    <div id="controls">
        <div class="dpad">
            <div class="control-btn" id="btnLeft">◀</div>
            <div class="control-btn" id="btnRight">▶</div>
        </div>
        <div class="control-btn" id="btnJump">PULO</div>
    </div>

    <!-- GAME OVER -->
    <div id="gameOverScreen">
        <h1>ELIMINADO!</h1>
        <p id="finalScore">Você chegou a 0m</p>
        <button class="map-btn" style="border-color: #ffd700; color: #ffd700; font-size: 20px; padding: 15px 40px;" onclick="location.reload()">JOGAR NOVAMENTE</button>
    </div>

    <script>
        // --- CONFIGURAÇÃO GLOBAL ---
        let scene, camera, renderer;
        let player;
        let isPlaying = false;
        let playerColor = 0x00a8ff;
        let currentMap = 'block';
        
        let score = 0;
        let baseSpeed = 0.45;
        let speed = baseSpeed;
        
        let playerLane = 0;
        let targetX = 0;
        let isJumping = false;
        let jumpVelocity = 0;
        let playerY = 0;
        
        const gravity = -0.025;
        const jumpStrength = 0.5;
        const laneWidth = 3.5;

        let obstacles = [];
        let spawnTimer = 0;
        let gameTime = 0;

        // --- INICIALIZAÇÃO ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 70);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 8);
            camera.lookAt(0, 1, -10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Iluminação (Configuração recomendada para mobile: poucas luzes)
            scene.add(new THREE.HemisphereLight(0xbbddff, 0x443322, 1.0));
            const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
            keyLight.position.set(5, 10, 7);
            keyLight.castShadow = true;
            scene.add(keyLight);

            createPlayer();
            window.addEventListener('resize', onWindowResize, false);
            setupControls();
            animate();
        }

        function createPlayer() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: playerColor, roughness: 0.3, metalness: 0.1 });
            
            // Corpo (Cápsula - Formato do Stumble Guys)
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 0.8, 4, 16), mat);
            body.position.y = 1.0;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Olhos (Para dar vida)
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), eyeMat);
            eyeL.position.set(-0.2, 1.4, 0.45);
            group.add(eyeL);
            const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), eyeMat);
            eyeR.position.set(0.2, 1.4, 0.45);
            group.add(eyeR);

            player = group;
            player.position.set(0, 0, 0);
            scene.add(player);
        }

        // --- LÓGICA DE SELEÇÃO ---
        function selectSkin(color, el) {
            playerColor = color;
            document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
        }

        function selectMap(map, el) {
            currentMap = map;
            document.querySelectorAll('.map-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
        }

        // --- INÍCIO DO JOGO ---
        function startGame() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('controls').style.display = 'flex';
            document.getElementById('hud').style.display = 'block';
            isPlaying = true;
            
            player.children[0].material.color.setHex(playerColor);
            
            score = 0;
            playerLane = 0;
            targetX = 0;
            player.position.set(0, 0, 0);
            speed = baseSpeed;
            gameTime = 0;
            obstacles.forEach(o => scene.remove(o));
            obstacles = [];
            spawnTimer = 0;

            buildMap();
        }

        function buildMap() {
            const oldFloor = scene.getObjectByName("floor");
            if (oldFloor) scene.remove(oldFloor);

            const floorGroup = new THREE.Group();
            floorGroup.name = "floor";

            if (currentMap === 'block') {
                // Chão do Block Dash
                const floorGeo = new THREE.BoxGeometry(12, 1, 200);
                const floorMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.position.set(0, -0.5, -90);
                floor.receiveShadow = true;
                floorGroup.add(floor);

                for(let i=0; i<3; i++){
                    const lineGeo = new THREE.PlaneGeometry(0.1, 200);
                    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    const line = new THREE.Mesh(lineGeo, lineMat);
                    line.rotation.x = -Math.PI / 2;
                    line.position.set((i-1)*laneWidth, 0.01, -90);
                    floorGroup.add(line);
                }
            } else {
                // Chão do Laser Tracer
                const floorGeo = new THREE.BoxGeometry(12, 1, 200);
                const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.position.set(0, -0.5, -90);
                floor.receiveShadow = true;
                floorGroup.add(floor);

                const grid = new THREE.GridHelper(200, 40, 0xff0000, 0x550000);
                grid.position.set(0, 0.01, -90);
                grid.rotation.x = Math.PI / 2;
                floorGroup.add(grid);
            }

            scene.add(floorGroup);
        }

        // --- CONTROLES ---
        function setupControls() {
            document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); movePlayer(-1); });
            document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); movePlayer(1); });
            document.getElementById('btnJump').addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
            
            window.addEventListener('keydown', (e) => {
                if(e.key === "ArrowLeft" || e.key === "a") movePlayer(-1);
                if(e.key === "ArrowRight" || e.key === "d") movePlayer(1);
                if(e.key === " " || e.key === "ArrowUp") jump();
            });
        }

        function movePlayer(dir) {
            if (!isPlaying) return;
            playerLane += dir;
            if (playerLane < -1) playerLane = -1;
            if (playerLane > 1) playerLane = 1;
            targetX = playerLane * laneWidth;
        }

        function jump() {
            if (!isPlaying || isJumping) return;
            isJumping = true;
            jumpVelocity = jumpStrength;
        }

        // --- OBSTÁCULOS ---
        function spawnObstacle() {
            const obsGroup = new THREE.Group();

            if (currentMap === 'block') {
                const isHole = Math.random() > 0.5;
                const holeLane = Math.floor(Math.random() * 3) - 1;

                if (isHole) {
                    for (let i = -1; i <= 1; i++) {
                        if (i !== holeLane) {
                            const block = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.5, 1), new THREE.MeshStandardMaterial({ color: 0xff3333 }));
                            block.position.set(i * laneWidth, 1.25, 0);
                            block.castShadow = true;
                            block.receiveShadow = true;
                            obsGroup.add(block);
                        }
                    }
                } else {
                    const block = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1, 1), new THREE.MeshStandardMaterial({ color: 0xff8800 }));
                    block.position.set(holeLane * laneWidth, 0.5, 0);
                    block.castShadow = true;
                    block.receiveShadow = true;
                    obsGroup.add(block);
                }
            } else {
                const laserMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                const beam = new THREE.Mesh(new THREE.BoxGeometry(12, 0.1, 0.1), laserMat);
                beam.position.set(0, 0.5, 0);
                
                const glow = new THREE.PointLight(0xff0000, 1, 5);
                glow.position.set(0, 0.5, 0);
                obsGroup.add(glow);
                obsGroup.add(beam);
            }

            obsGroup.position.z = -100;
            scene.add(obsGroup);
            obstacles.push(obsGroup);
        }

        function checkCollision(obs) {
            if (Math.abs(obs.position.z - player.position.z) < 0.8) {
                if (currentMap === 'block') {
                    obs.children.forEach(child => {
                        if (child.geometry.parameters.height > 2) {
                            if (Math.abs(child.position.x - player.position.x) < 1.2 && player.position.y < 1) return true;
                        } else {
                            if (Math.abs(child.position.x - player.position.x) < 1.2 && player.position.y < 0.8) return true;
                        }
                    });
                } else {
                    if (player.position.y < 0.8) return true;
                }
            }
            return false;
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('gameOverScreen').style.display = 'flex';
            document.getElementById('finalScore').innerText = "Você chegou a " + Math.floor(score) + "m";
        }

        // --- LOOP DE ANIMAÇÃO ---
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                gameTime++;
                speed = baseSpeed + (gameTime * 0.0001);
                if (speed > 1.8) speed = 1.8;

                player.position.x += (targetX - player.position.x) * 0.2;

                if (isJumping) {
                    player.position.y += jumpVelocity;
                    jumpVelocity += gravity;
                    if (player.position.y <= 0) {
                        player.position.y = 0;
                        isJumping = false;
                        jumpVelocity = 0;
                    }
                }

                spawnTimer++;
                let spawnRate = currentMap === 'block' ? 50 : 40;
                if (spawnTimer > (spawnRate - (speed * 5))) {
                    spawnObstacle();
                    spawnTimer = 0;
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += speed;

                    if (checkCollision(obs)) {
                        gameOver();
                    }

                    if (obs.position.z > 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        score += 1;
                        document.getElementById('score').innerText = Math.floor(score);
                    }
                }
            }

            if (isPlaying) {
                camera.position.x += (player.position.x * 0.6 - camera.position.x) * 0.05;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
